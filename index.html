<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#2f4a7a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Word Voyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ch:#4f7cff;--chl:#dfe8ff;--ink:#2b1d3a;--green:#3cc46a;--yellow:#ffc531;--grey:#8d8a9e;--paper:#fffaf0;--tile:clamp(38px,min(11.5vw,6.4dvh),58px)}
body.cb{--green:#f5793a;--yellow:#4fa3f7}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 30% 10%,var(--chl),#fff 60%),var(--chl);transition:background .6s}
body[data-size=s]{font-size:14px}body[data-size=m]{font-size:16px}body[data-size=l]{font-size:18.5px}
#app{position:relative;max-width:560px;height:100dvh;margin:0 auto;background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 10px 40px rgba(0,0,0,.2);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex;animation:screenIn .35s cubic-bezier(.3,1.4,.6,1)}
@keyframes screenIn{from{opacity:0;transform:scale(.97)}}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:.55em 1em;font-weight:600;font-size:1em;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:1.15em;padding:.6em 1.3em}
.btn.go{background:var(--ch);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn.small{font-size:.85em;padding:.35em .7em;border-radius:12px}
.btn.danger{background:#ff6b6b;color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.icon{border:2.5px solid var(--ink);background:#fff;border-radius:12px;width:2.3em;height:2.3em;font-size:1em;display:inline-grid;place-items:center;box-shadow:0 3px 0 var(--ink);padding:0}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.small{font-size:.85em}.center{text-align:center}
.chip{border:2px solid var(--ink);border-radius:99px;background:#fff;padding:.15em .7em;font-weight:600;margin:2px}
/* scenes */
.scene{display:block;width:100%;height:100%}
.drift{animation:drift 50s linear infinite}@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(520px)}}
.drive{animation:drive 10s linear infinite}@keyframes drive{from{transform:translateX(-240px)}to{transform:translateX(460px)}}
.driveR{animation:driveR 10s linear infinite}@keyframes driveR{from{transform:translateX(460px) scaleX(-1)}to{transform:translateX(-240px) scaleX(-1)}}
.driveR>g{transform-box:fill-box}
.bump{animation:bump .4s ease-in-out infinite alternate}@keyframes bump{to{transform:translateY(-1.5px)}}
.spinw{animation:spin 0.6s linear infinite}
.spin{animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.clockm{animation:spin 6s linear infinite}.clockh{animation:spin 72s linear infinite}
.sway{animation:sway 3.5s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.swing{animation:swing 2.4s ease-in-out infinite alternate}@keyframes swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.flutter{animation:flutter 1.2s ease-in-out infinite alternate}@keyframes flutter{to{transform:skewX(8deg) scaleY(.92)}}
.bob{animation:bob 1.6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-4px) rotate(2deg)}}
.pulse{animation:pulse 3s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.twinkle{animation:twinkle 1.8s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:1}to{opacity:.2}}
.fall{animation:fall 4s linear infinite}@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(250px)}}
.fall.snow,.fall.petal,.fall.confetti{animation-name:fallSway}@keyframes fallSway{0%{transform:translate(0,-20px) rotate(0)}50%{transform:translate(12px,115px) rotate(180deg)}100%{transform:translate(-6px,250px) rotate(360deg)}}
.waves{animation:waves 3s ease-in-out infinite alternate}@keyframes waves{to{transform:translateX(14px)}}
.hop{animation:hopY .7s cubic-bezier(.3,0,.7,1) infinite}@keyframes hopY{50%{transform:translateY(-26px)}}
.leap{animation:hopY .9s ease-in-out infinite}
.giraffe{animation:bob 1s ease-in-out infinite alternate}
.legs{animation:legs .5s ease-in-out infinite alternate}.legs2{animation:legs .5s ease-in-out infinite alternate-reverse}@keyframes legs{to{transform:translateX(3px)}}
.soar{animation:soar 3s ease-in-out infinite alternate}@keyframes soar{to{transform:translateY(-18px)}}
.flapw{transform-box:fill-box;transform-origin:center;animation:flapw .5s ease-in-out infinite alternate}@keyframes flapw{to{transform:scaleY(.4)}}
.flap{animation:flap .6s ease-in-out infinite alternate}@keyframes flap{to{transform:scaleY(.4)}}
.surf{animation:surf 2s ease-in-out infinite alternate}@keyframes surf{to{transform:translateY(-8px) rotate(-4deg)}}
.smoke{animation:smoke 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:.9}100%{transform:translateY(-60px) scale(1.6);opacity:0}}
.flicker{animation:flicker .3s ease-in-out infinite alternate}@keyframes flicker{to{transform:scale(1.15,.9)}}
.firework{animation:firework 2.75s ease-out infinite}@keyframes firework{0%{transform:scale(.1);opacity:0}10%{opacity:1}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.shimmer{animation:twinkle 1s infinite alternate}
.waddle{animation:bob .4s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.scene *{animation-duration:0s!important;animation-iteration-count:1!important}}
/* title */
#title{background:#9cc9ef}
.titleScene{position:absolute;inset:0 0 auto 0;height:55%}
.titleScene .scene{height:100%}
.titleCard{position:relative;margin-top:auto;box-shadow:0 -6px 0 rgba(43,29,58,.15);background:var(--paper);border-top:3px solid var(--ink);border-radius:28px 28px 0 0;padding:1em 1.2em 1.2em;text-align:center;display:flex;flex-direction:column;gap:.4em;align-items:center;max-height:75%;overflow:auto}
.logo{font-size:2.6em;font-weight:700;line-height:.95;margin-top:.1em;display:flex;gap:.25em;filter:drop-shadow(0 4px 0 var(--ink))}
.logo span{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:0 .25em;color:#e8455a;transform:rotate(-4deg)}
.logo span+span{color:#4f7cff;transform:rotate(3deg)}
.tagline{font-weight:500;opacity:.8}
.titlePip{width:84px;height:84px;margin:-.2em 0;animation:bob 1.2s ease-in-out infinite alternate}
#loginForm{display:flex;flex-direction:column;align-items:center;gap:.45em;width:100%}
#loginForm.shake,.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lbl{font-weight:600;font-size:1.1em}
#nameInput{font-family:inherit;font-size:1.4em;font-weight:600;text-align:center;border:3px solid var(--ink);border-radius:16px;padding:.35em .5em;width:min(100%,300px);box-shadow:inset 0 3px 0 rgba(0,0,0,.08);outline:none}
#nameInput:focus{border-color:var(--ch)}
.colorLbl{font-size:.9em}
#colorRow{display:flex;gap:.5em}
.colorPick{width:2em;height:2em;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.colorPick.sel{outline:3px solid var(--ch);outline-offset:3px}
.err{color:#d6283a;font-weight:600;min-height:1.1em;font-size:.9em}
.tog{display:flex;align-items:center;gap:.5em}
.known{font-size:.9em}
#welcomeBack{display:flex;flex-direction:column;align-items:center;gap:.5em}
.wbPip{width:90px;height:90px;margin:auto}
#welcomeBack h2{margin:.2em 0}
/* bars */
.bar{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:.5em .7em;background:var(--ch);border-bottom:3px solid var(--ink);color:#fff;transition:background .5s}
.barBtns{display:flex;gap:.35em;align-items:center}
.barTitle{font-weight:700;font-size:1.2em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.who{display:flex;align-items:center;gap:.4em;font-weight:700;font-size:1.1em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.miniPip{width:2em;height:2em;display:inline-block}
.stats{display:flex;justify-content:space-around;padding:.35em;font-weight:600;background:#fff;border-bottom:2px solid var(--ink)}
.heart{font-size:.95em}
.chapterBar{display:flex;gap:4px;padding:.4em .7em;align-items:center;flex-wrap:wrap;background:var(--chl);border-bottom:2px solid var(--ink)}
.chSeg{flex:1;height:10px;border-radius:6px;border:2px solid var(--ink);background:#fff}
.chSeg.done{background:var(--c)}.chSeg.cur{background:repeating-linear-gradient(45deg,var(--c) 0 6px,#fff 6px 10px)}
.chName{width:100%;text-align:center;font-weight:600;font-size:.9em}
.mapWrap{position:relative;flex:1;min-height:0;background:#5cc3ec}
#worldMap{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.route{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:5 5;stroke-linecap:round;opacity:.85;vector-effect:non-scaling-stroke}
.route.done{stroke:var(--ink);stroke-dasharray:none;opacity:.8}
.route.flying{stroke:#ff4f7b;stroke-width:3.5;opacity:1}
.stopPin{cursor:pointer}
.stopPin.locked{opacity:.75}
.stopPin .pulseRing{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.zoomBtns{position:absolute;right:.6em;top:.6em;display:flex;flex-direction:column;gap:.4em}
.stopCard{position:absolute;left:.6em;right:.6em;bottom:.8em;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);display:flex;overflow:hidden;animation:cardIn .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes cardIn{from{transform:translateY(120%)}}
.scThumb{width:34%;min-width:110px;border-right:3px solid var(--ink)}
.scBody{padding:.55em .7em;flex:1;display:flex;flex-direction:column;gap:.15em}
.scTitle{font-weight:700;font-size:1.2em}
.scSub{font-size:.85em;opacity:.85}
.scBtns{display:flex;gap:.4em;margin-top:.3em;align-items:center}
.boss{background:#ffd23f;border:2px solid var(--ink);border-radius:8px;font-size:.65em;padding:0 .35em;vertical-align:middle;color:var(--ink);text-shadow:none}
/* puzzle */
.pzBar{padding:.4em .6em}
.pzTitleWrap{text-align:center;font-weight:700;font-size:1.15em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#pzDots{display:flex;gap:5px;justify-content:center;margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dot.done{background:#ffd23f}.dot.cur{background:#fff;animation:pulse .6s infinite alternate}
.pzSceneWrap{position:relative;height:clamp(96px,24dvh,230px);border-bottom:3px solid var(--ink);flex:none;overflow:hidden}
#pzScene{position:absolute;inset:0}
.pzPip{position:absolute;left:6px;bottom:2px;width:clamp(56px,13dvh,92px);height:clamp(56px,13dvh,92px)}
.pzPip.react.happy{animation:hop .5s}.pzPip.react.wow{animation:hop .5s 2}
.pzPip.react.worried{animation:shake .4s}.pzPip.react.sad{animation:droop .8s forwards}
@keyframes hop{50%{transform:translateY(-14px) scale(1.05,.95)}}@keyframes droop{to{transform:translateY(4px) scaleY(.92)}}
.bubble{position:absolute;left:calc(clamp(56px,13dvh,92px) + 10px);bottom:clamp(28px,7dvh,56px);max-width:62%;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:.3em .6em;font-weight:600;font-size:.85em;box-shadow:0 3px 0 var(--ink)}
.bubble::before{content:'';position:absolute;left:-10px;bottom:8px;border:8px solid transparent;border-right-color:var(--ink)}
.bubble.pop{animation:popIn .35s cubic-bezier(.3,1.6,.6,1)}@keyframes popIn{from{transform:scale(.5);opacity:0}}
.pzMain{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding:.4em .3em .5em;background:linear-gradient(var(--chl),var(--paper) 40%)}
#board{display:grid;gap:5px;justify-content:center;align-content:center;flex:1;min-height:0}
.row{display:grid;grid-template-columns:repeat(var(--cols),var(--tile));gap:5px}
.row.shake{animation:shake .45s}
.tile{width:var(--tile);height:var(--tile);position:relative;perspective:400px}
.face{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:calc(var(--tile)*.55);border:3px solid var(--ink);border-radius:12px;backface-visibility:hidden;transition:transform .32s cubic-bezier(.4,1.6,.6,1);text-transform:uppercase}
.front{background:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.tile:not(.filled) .front{border-color:#cfc8dc;border-style:dashed}
.back{transform:rotateX(180deg);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.tile.flipped .front{transform:rotateX(180deg)}.tile.flipped .back{transform:rotateX(0)}
.green{background:var(--green)}.yellow{background:var(--yellow)}.grey{background:var(--grey)}.plain{background:#fff;color:var(--ink)!important;text-shadow:none!important}
body.cb .back.green::after,body.cb .key.green::after{content:'●';position:absolute;top:1px;right:4px;font-size:.35em}
body.cb .back.yellow::after,body.cb .key.yellow::after{content:'◆';position:absolute;top:1px;right:4px;font-size:.35em}
.tile.pop{animation:tpop .12s}@keyframes tpop{50%{transform:scale(1.12)}}
.tile.dance{animation:dance .5s}@keyframes dance{30%{transform:translateY(-16px) scale(1.06,.94)}60%{transform:translateY(3px) scale(.95,1.05)}}
.tile.mini{--tile:2.1em;display:inline-block;margin:2px}
.hintBar{display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:.25em .3em;font-size:.88em}
#hintRow{flex:1}.theme{opacity:.75}
#pzCoins{font-weight:700}
#kb{display:flex;flex-direction:column;gap:6px;user-select:none}
.kbRow{display:flex;justify-content:center;gap:5px}
.key{flex:1;max-width:44px;height:clamp(40px,6.6dvh,56px);border:2.5px solid var(--ink);border-radius:10px;background:#fff;font-weight:700;font-size:1.05em;box-shadow:0 4px 0 var(--ink);padding:0;position:relative;transition:background .3s}
.key.wide{max-width:70px;flex:1.6;font-size:.72em}
.key.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.green{background:var(--green)}.key.yellow{background:var(--yellow)}.key.grey{background:var(--grey)}
.key.green,.key.yellow,.key.grey{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(43,29,58,.55);display:none;place-items:center;z-index:50;padding:1em}
.modal.show{display:grid;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modalBox{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:1.1em;width:min(100%,440px);max-height:90dvh;overflow:auto;text-align:center;animation:popIn .4s cubic-bezier(.3,1.5,.6,1)}
.modalBox h2{margin:.2em 0}
.resPip{width:90px;height:90px;margin:auto}
.result.win .resPip{animation:hop .6s 3}
.resWord{margin:.3em 0}
.fact{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:.6em;margin:.5em 0;text-align:left;font-size:.95em}
.pts{background:#fff;border:2.5px dashed var(--ink);border-radius:14px;padding:.5em .8em;margin:.5em 0}
.pts div{display:flex;justify-content:space-between}.pts .tot{border-top:2px solid var(--ink);margin-top:.3em;padding-top:.3em;font-size:1.05em}
.shareRow{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:.4em}
.rankBanner{background:#ffd23f;border:3px solid var(--ink);border-radius:14px;font-weight:700;padding:.3em;margin-bottom:.4em;animation:popIn .5s .3s both cubic-bezier(.3,1.6,.6,1)}
.stamp{--c:#4f7cff;width:100%;aspect-ratio:1;border:3px dashed var(--c);outline:3px solid var(--c);outline-offset:-9px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c);font-weight:700;background:rgba(255,255,255,.6);padding:10%}
.stamp .sFlag{font-size:1.6em;line-height:1}.stamp .sName{font-size:.7em;letter-spacing:.04em;text-align:center;line-height:1.05}.stamp .sDate{font-size:.55em;opacity:.8}
.stamp.empty{--c:#c9c4d6;color:#a9a4b6}
.stamp.big{width:170px;margin:auto;font-size:1.4em;animation:stampIn .5s cubic-bezier(.5,1.8,.6,1);transform:rotate(-8deg)}
@keyframes stampIn{from{transform:scale(3) rotate(-30deg);opacity:0}}
.passportPage{background:linear-gradient(#fdf6e3,#f6ead0);border:3px solid var(--ink);border-radius:16px;padding:1em;margin-bottom:.5em}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:.6em;margin:.5em 0;font-weight:600;text-align:left}
.settings input[type=range]{flex:1;accent-color:var(--ch)}
.settings select{font-family:inherit;font-size:1em;border:2.5px solid var(--ink);border-radius:10px;padding:.2em .4em}
.settings label.tog{justify-content:flex-start}
.settings input[type=checkbox],.tog input{width:1.3em;height:1.3em;accent-color:var(--ch)}
.stBtns{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center;margin:.6em 0}
.help{text-align:left}.help h2,.help .btn{display:block;margin:.3em auto;text-align:center}
.exRow{text-align:center}
.sw{display:inline-block;width:1em;height:1em;border:2px solid var(--ink);border-radius:4px;vertical-align:middle}
/* passport */
.ppHead{display:flex;align-items:center;gap:.6em;padding:.6em .9em;background:linear-gradient(#7a2a3a,#5a1a2a);color:#ffe9b0;border-bottom:3px solid var(--ink)}
.ppHead h2{margin:0}.ppHead p{margin:0;font-size:.9em}
.ppPip{width:64px;height:64px;flex:none}
.ppGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.6em;padding:.8em;background:linear-gradient(#fdf6e3,#f3e3c0);align-content:start}
.ppCell{border:none;background:none;padding:0}
.ppCell.got .stamp{animation:popIn .4s both}
.factScene{height:140px;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
/* leaderboard */
.tabs{display:flex;gap:.3em;padding:.6em;justify-content:center}
.tabs button{border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:600;padding:.3em .8em;box-shadow:0 3px 0 var(--ink)}
.tabs button.sel{background:var(--ch);color:#fff}
#lbList{flex:1;overflow:auto;padding:0 .7em}
.lbRow{display:grid;grid-template-columns:2.4em 2em 1fr 1.6em 3em 3.5em;align-items:center;gap:.3em;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:.3em .5em;margin:.35em 0;box-shadow:0 3px 0 var(--ink);font-weight:600}
.lbRow.me{background:#fff4c9;outline:3px solid var(--ch)}
.lbRow .rk{font-size:1.1em;text-align:center}.lbRow .sc{text-align:right}.lbRow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbPip{width:2em;height:2em}.lbGap{text-align:center;font-weight:700}
.empty{text-align:center;opacity:.75;padding:2em 1em}
/* arrival */
.arrival{position:absolute;inset:0;z-index:30;background:var(--sky,#9cc9ef);opacity:0;transition:opacity .35s;display:flex;flex-direction:column;justify-content:flex-end}
.arrival[hidden]{display:none!important}
.arrScene{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.arrival.in{opacity:1}
.arrival .scene{width:100%;height:auto;max-height:100%;transform-origin:50% 100%}
.arrival.in .scene{animation:zoomScene 6s ease-out both}@keyframes zoomScene{from{transform:scale(1.25)}}
.arrCard{position:relative;margin:0 1em 1.2em;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:1em;text-align:center;transform:translateY(130%);transition:transform .5s .4s cubic-bezier(.3,1.5,.6,1)}
.arrival.in .arrCard{transform:none}
.arrCard h1{margin:.1em 0;font-size:1.7em;line-height:1.1}.arrCard p{margin:.3em 0 .6em}
.arrCh{display:inline-block;background:var(--ch);color:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:.1em .6em;font-weight:700}
.arrPip{width:80px;height:80px;margin:-60px auto 0;animation:hop .6s 2 .9s}
/* toast + confetti */
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-weight:700;padding:.5em 1em;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:conf linear forwards}

/* ===== refined theme ===== */
:root{--ink:#1f2433;--paper:#f6f1e7;--green:#4f8a5b;--yellow:#c9a13b;--grey:#7b7f8a;--line:rgba(31,36,51,.22)}

.bar .icon{background:rgba(255,255,255,.92)}

.chip{border:1px solid var(--line);font-weight:500}
.bar{border-bottom:none;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.barTitle,.who,.pzTitleWrap{text-shadow:none}
.stats{border-bottom:1px solid var(--line);font-weight:500;background:var(--paper)}

.mapWrap{background:#b7cfd6}

.scThumb{border-right:none}

.pzSceneWrap{border-bottom:none}
.bubble{left:0;right:0;bottom:0;max-width:none;border:none;border-radius:0;box-shadow:none;background:linear-gradient(transparent,rgba(31,36,51,.72));color:#fff;font-weight:500;padding:1.4em .9em .45em;font-size:.85em}

.pzMain{background:var(--paper)}
.face{border:1.5px solid var(--ink);border-radius:5px;font-weight:600;transition:transform .34s ease}
.front{box-shadow:none}

.key.green,.key.yellow,.key.grey{text-shadow:none}
.modal{background:rgba(20,23,33,.6)}

.fact,.pts{border:1px solid var(--line);border-radius:8px}.pts{border-style:solid}
.pts .tot{border-top:1px solid var(--line)}
.rankBanner{background:var(--yellow);border:none;border-radius:8px;color:#fff;font-weight:600}
.passportPage{border:1px solid var(--line);border-radius:8px}
.stamp{border-width:2px;outline-width:1.5px}
.settings select,.settings label{font-weight:500}.settings select{border:1px solid var(--line);border-radius:8px}
.sw{border:none;border-radius:2px}
.tabs button{border:1px solid var(--line);border-radius:8px;box-shadow:none;font-weight:500}
.lbRow{border:1px solid var(--line);border-radius:8px;box-shadow:none;font-weight:500}
.lbRow.me{background:#f3e7c2;outline:1.5px solid var(--ch)}
.arrCard{border:none;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:transform .5s .4s ease,opacity .5s .4s;transform:translateY(30%);opacity:0}
.arrival.in .arrCard{opacity:1}
.arrCh{border:none;border-radius:4px;font-size:.72em;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:.25em .7em}
.factScene{border:none;border-radius:8px}
#toast{border-radius:8px;font-weight:500}
#confetti i{width:6px;height:10px;border-radius:1px}
/* whoopsie pop-out */
#whoops{position:absolute;left:0;bottom:0;z-index:40;pointer-events:none;width:min(58%,300px);transform:translateX(-110%);transform-origin:0 100%}
#whoops img{display:block;width:100%;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
#whoops.show{animation:whoopsIn 2s cubic-bezier(.3,1.2,.4,1)}
@keyframes whoopsIn{0%{transform:translateX(-110%) rotate(-12deg)}13%{transform:translateX(0) rotate(5deg)}20%,80%{transform:translateX(-3%) rotate(2deg)}100%{transform:translateX(-110%) rotate(-10deg)}}
.wBubble{position:absolute;left:62%;top:-24%;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:50%;padding:.7em 1.1em;font-weight:700;font-size:1.35em;white-space:nowrap;opacity:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wBubble::after{content:'';position:absolute;left:8%;bottom:-14px;border:9px solid transparent;border-top-color:var(--ink);border-left-color:var(--ink);transform:skewX(20deg)}
#whoops.show .wBubble{animation:wb 2s}
@keyframes wb{0%,12%{opacity:0;transform:scale(.4)}20%,80%{opacity:1;transform:scale(1)}90%,100%{opacity:0}}

/* ===== photo backgrounds ===== */
.photo{position:relative;width:100%;height:100%;overflow:hidden;background:#1f2433}
.photoImg{position:absolute;inset:-4%;background-size:cover;background-position:50% 42%;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,1%)}}
.photo.thumb .photoImg{animation:none;inset:0}
.credit{position:absolute;right:4px;top:3px;font-size:9px;line-height:1.2;color:#fff;background:rgba(0,0,0,.38);padding:1px 5px;border-radius:3px;letter-spacing:.02em;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo.thumb .credit{display:none}
.titleScene .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(31,36,51,.45))}
.arrScene{position:absolute;inset:0}
.arrival{background:#1f2433}
.arrival .arrCard{z-index:2}
.arrival .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(20,23,33,.7))}
.arrival.in .photoImg{animation:kb 14s ease-out both}
.factScene{position:relative}
.ic{width:1.25em;height:1.25em;display:block}
.icon{color:var(--ink)}
.stats span i{font-style:normal;font-size:.7em;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-right:.3em}
.heart{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#b0473f;margin:0 1px;vertical-align:middle}
.heart.empty{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(31,36,51,.35)}
.pzBar .heart{background:#fff}.pzBar .heart.empty{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
#pzCoins{font-weight:500;font-size:.9em}
.help a{color:var(--ch)}
.lbRow{grid-template-columns:1.6em 2em 1fr 1.6em 3.4em 4.6em}.lbRow .rk{font-size:1em;opacity:.7}.lbRow .stp{font-size:.8em;opacity:.7}

/* yahoo pop-out (right side) */
#whoops,#yahoo{z-index:80}
#yahoo{position:absolute;right:0;bottom:0;pointer-events:none;width:min(56%,290px);transform:translateX(110%);transform-origin:100% 100%}
#yahoo img{display:block;width:100%;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
#yahoo.show{animation:yahooIn 2.1s cubic-bezier(.3,1.2,.4,1)}
@keyframes yahooIn{0%{transform:translateX(110%) rotate(12deg)}13%{transform:translateX(0) rotate(-5deg)}20%,80%{transform:translateX(3%) rotate(-2deg)}100%{transform:translateX(110%) rotate(10deg)}}
#yahoo .wBubble{left:auto;right:62%;top:-22%}
#yahoo .wBubble::after{left:auto;right:8%;border-left-color:transparent;border-right-color:var(--ink);transform:skewX(-20deg)}
#yahoo.show .wBubble{animation:wb 2.1s}

/* finale */
#finale{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 100%,#1c2748 0%,#0b1022 55%,#05070f 100%);color:#fff;opacity:0;transition:opacity .5s;overflow:hidden}
#finale[hidden]{display:none!important}#finale.in{opacity:1}
#fwCanvas{position:absolute;inset:0;width:100%;height:100%}
.finInner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2em;gap:.35em}
.finKicker{letter-spacing:.22em;text-transform:uppercase;font-size:.78em;color:#e6c66a}
.finInner h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(2em,9vw,3.2em);line-height:1.05;margin:.1em 0;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.finWon{font-size:1.5em;font-weight:700;color:#e6c66a;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#dancer{width:min(42vw,170px);height:auto;aspect-ratio:24/32;image-rendering:pixelated;image-rendering:crisp-edges;margin:.3em 0;filter:drop-shadow(0 0 14px rgba(255,255,255,.18))}
.finStats{display:flex;gap:1.4em;margin:.2em 0 .6em}.finStats div{display:flex;flex-direction:column}.finStats b{font-size:1.5em;font-family:'DM Serif Display',Georgia,serif;font-weight:400}.finStats span{font-size:.75em;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.finBtns{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.bubble{position:static;background:#1f2433;color:#fff;padding:.4em .9em;font-size:.82em;flex:none;min-height:1.5em;line-height:1.3}
#finale .btn:not(.go){color:#1f2433;background:#fff}
/* boss suitcases */
.cases{text-align:center}.cases .finKicker{color:var(--ch)}.cases h2{margin:.2em 0}.cases p{min-height:3.9em;margin:.3em 0 .2em}
.caseRow{display:flex;gap:.3em;justify-content:center;margin:.2em 0 .8em}
.case{flex:1;max-width:130px;background:none;border:none;padding:0;cursor:pointer;transition:transform .2s,opacity .4s}
.case:not(.open):hover{transform:translateY(-4px)}.case:not(.open){animation:caseBob 2.4s ease-in-out infinite}.case:nth-child(2){animation-delay:.3s}.case:nth-child(3){animation-delay:.6s}
@keyframes caseBob{50%{transform:translateY(-3px)}}
.caseSvg{width:100%;display:block;overflow:visible}
.caseSvg .lid{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:14px 62px;transform-box:view-box}
.caseSvg .inside{opacity:0;transform:translateY(16px);transition:opacity .3s .2s,transform .5s .2s cubic-bezier(.3,1.4,.5,1)}
.case.open .lid{transform:translateY(-40px) rotate(-10deg)}.case.open .inside{opacity:1;transform:none}
.case.other{opacity:.55}.case.mine{transform:scale(1.08)}
.caseSvg .tw{animation:twk 1s infinite;transform-origin:center;transform-box:fill-box}.caseSvg .t2{animation-delay:.3s}.caseSvg .t3{animation-delay:.6s}@keyframes twk{50%{opacity:.2;transform:scale(.5)}}
.caseSvg .stink{animation:stink 1.6s ease-in-out infinite}@keyframes stink{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.caseSvg .fly{animation:fly 1.1s linear infinite}.caseSvg .f2{animation-duration:1.5s;animation-direction:reverse}@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(7px,-4px)}50%{transform:translate(1px,-9px)}75%{transform:translate(-7px,-3px)}100%{transform:translate(0,0)}}
.devBtns{display:flex;flex-direction:column;gap:.6em;margin-top:.6em}
#dancer{width:min(64vw,270px);aspect-ratio:3/4;image-rendering:auto;margin:0;filter:none}
.finInner{gap:.15em}.finInner h1{font-size:clamp(1.7em,8vw,2.8em)}
#dancer{image-rendering:pixelated}

<div id="app">
  <!-- TITLE -->

    [0, 1, [-4, 4], [7, -8], [-4, 12], [3, 12]],
    [-1, 0, [-7, 2], [5, 5], [-5, 12], [1, 13]],
    [0, 1, [-7, -8], [4, 4], [-3, 12], [4, 12]],
    [1, 0, [-5, 5], [7, 2], [-1, 13], [5, 12]],
  ];
  const [bx, by, lh, rh, lf, rf] = POSES[f % POSES.length]; const cx = 12 + bx, top = 8 + by;
  const skin = '#e8b88f', hair = '#3b2a20', trousers = '#27314d', shoe = '#141824';
  px(4, 30, 16, 1, 'rgba(0,0,0,.28)');
  line(cx - 2, top + 13, 12 + lf[0], 17 + lf[1], trousers, 2); line(cx + 1, top + 13, 12 + rf[0], 17 + rf[1], trousers, 2);
  px(12 + lf[0] - 1.5, 17 + lf[1] + 1, 3, 2, shoe); px(12 + rf[0] - .5, 17 + rf[1] + 1, 3, 2, shoe);
  px(cx - 3, top + 6, 6, 8, color); px(cx - 3, top + 12, 6, 2, trousers);
  line(cx - 3, top + 7, cx + lh[0], top + 7 + lh[1], color, 2); line(cx + 2, top + 7, cx + rh[0], top + 7 + rh[1], color, 2);
  px(cx + lh[0] - .5, top + 7 + lh[1], 2, 2, skin); px(cx + rh[0] - .5, top + 7 + rh[1], 2, 2, skin);
  px(cx - 3, top, 6, 6, skin); px(cx - 3, top - 1, 6, 2, hair); px(cx - 3, top, 1, 3, hair); px(cx + 2, top, 1, 3, hair);
  px(cx - 2, top + 3, 1, 1, '#1f2433'); px(cx + 1, top + 3, 1, 1, '#1f2433'); px(cx - 1, top + 4.6, 2, 1, '#a14a3a');
}
function showFinale(preview) {
  closeModal(); if (!preview) renderMap({ noCard: true }); Sound.play('victory');
  const el = $('#finale'); el.hidden = false;
  el.innerHTML = `<canvas id="fwCanvas"></canvas><div class="finInner"><div class="finKicker">World Tour complete</div><h1>Congratulations${P.name ? ',<br>' + esc(P.name) : ''}!</h1><div class="finWon">You won!</div><canvas id="dancer" width="450" height="600"></canvas>
    <div class="finStats"><div><b>${P.score}</b><span>points</span></div><div><b>${P.tourGuesses}</b><span>guesses</span></div><div><b>${Object.keys(P.stamps).length}</b><span>stamps</span></div></div>
    <div class="finBtns"><button class="btn big go" id="finAgain">Play again</button><button class="btn" id="finOk">Leaderboard</button></div></div>`;
  void el.offsetWidth; el.classList.add('in');
  fireworks($('#fwCanvas'));
  const dc = $('#dancer'); const t0 = performance.now(); const col = P.color;
  if (!HEAD && typeof HEAD_IMG !== 'undefined') { const im = new Image(); im.onload = () => { HEAD = im; }; im.src = HEAD_IMG; const ib = new Image(); ib.onload = () => { HEADB = ib; }; ib.src = HEAD_BACK; }
  const dstep = now => { drawDancer2(dc, (now - t0) / 1000, col); FIN.raf2 = requestAnimationFrame(dstep); }; FIN.raf2 = requestAnimationFrame(dstep);
  FIN.pop = () => Sound.sfx('boom');
  $('#finOk').onclick = () => { closeFinale(); renderLeaderboard('champ'); };
  if (preview) $('#finAgain').textContent = 'Back to map';
  $('#finAgain').onclick = () => { if (preview) { closeFinale(); show('map'); renderMap(); } else newVoyage(); };
}

// ================= PASSPORT =================
function renderPassport() {
  show('passport');
  $('#ppHead').innerHTML = `<div class="ppPip">${mascotSVG(P.color)}</div><div><h2>${esc(P.name)}'s passport</h2><p>${Object.keys(P.stamps).length} of ${LOCS.length} stamps · ${P.score} pts · ${P.solved} words solved</p></div>`;
  $('#ppGrid').innerHTML = LOCS.map((L, i) => { const s = P.stamps[i]; const c = CHAPTERS[L.ch].color;
    return `<button class="ppCell ${s ? 'got' : ''}" data-i="${i}">${s ? `<div class="stamp" style="--c:${c};transform:rotate(${(hash(L.id) % 20) - 10}deg)"><div class="sFlag">${L.flag}</div><div class="sName">${esc(L.ch === 5 ? 'HOME' : L.name.toUpperCase())}</div><div class="sDate">${s.solved}/${s.of || 3} · ${s.guesses}g</div></div>` : `<div class="stamp empty"><div class="sFlag">?</div><div class="sName">${i <= P.stop ? esc(L.name) : '???'}</div></div>`}</button>`; }).join('');
  $$('#ppGrid .ppCell').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (P.stamps[i] || Object.values(P.learned).includes(i)) showFacts(i); else toast('Not visited yet!'); });
}
function showFacts(i) {
  const L = LOCS[i]; const words = L.words.filter(([w]) => P.learned[w] === i);
  modal(`<div class="factsBox"><div class="factScene">${sceneSVG(L.id)}</div><h2>${L.flag} ${esc(L.name)}</h2>${words.length ? words.map(([w, f]) => `<div class="fact"><b>${w}</b><br>${esc(f)}</div>`).join('') : '<p>Solve words here to collect fun facts.</p>'}<p class="small">♪ ${esc(TUNES[L.tune].title)}</p><button class="btn big" id="fOk">Close</button></div>`);
  $('#fOk').onclick = closeModal;
}

// ================= LEADERBOARD =================
function renderLeaderboard(tab) {
  if (tab) UI.lbTab = tab; show('leaderboard');
  $$('#lbTabs button').forEach(b => b.classList.toggle('sel', b.dataset.t === UI.lbTab));
  const rows = sortRows(allRows(), UI.lbTab); const me = P ? rows.findIndex(r => r.name.toLowerCase() === P.key) : -1;
  const row = (r, i) => `<div class="lbRow ${me === i ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="lbPip">${mascotSVG(r.color || MASCOT_COLORS[0])}</span><span class="nm">${esc(r.name)}${r.champion ? ' ★' : ''}</span><span class="fl">${r.flag || ''}</span><span class="stp">${r.stamps} st.</span><span class="sc">${UI.lbTab === 'week' ? r.weekScore : UI.lbTab === 'champ' ? r.tourGuesses + 'g' + '' : r.score}</span></div>`;
  let html = rows.slice(0, 10).map(row).join('');
  if (me >= 10) html += `<div class="lbGap">⋯</div>` + row(rows[me], me);
  if (!rows.length) html = `<p class="empty">${UI.lbTab === 'champ' ? 'Nobody has finished the World Tour yet. Will you be first?' : 'No scores yet this week. Solve a puzzle to get on the board!'}</p>`;
  $('#lbList').innerHTML = html;
  $('#lbNote').textContent = Cloud.db && Cloud.rows ? (Cloud.writable ? 'Shared leaderboard: everyone with the link sees these names.' : 'You can view the shared board; your scores stay on this device.') : 'Showing travellers on this device.';
}

// ================= SETTINGS / HELP =================
function showSettings() {
  const s = P.settings;
  modal(`<div class="settings"><h2>Settings</h2>
    <label>Music <input type="range" min="0" max="1" step="0.05" value="${s.music}" id="stMusic"></label>
    <label>Effects <input type="range" min="0" max="1" step="0.05" value="${s.sfx}" id="stSfx"></label>
    <label class="tog"><input type="checkbox" id="stMute" ${s.mute ? 'checked' : ''}> Mute all sound</label>
    <label class="tog"><input type="checkbox" id="stCb" ${s.cb ? 'checked' : ''}> Colour-blind mode (orange/blue + symbols)</label>
    <label class="tog"><input type="checkbox" id="stRelax" ${s.relaxed ? 'checked' : ''}> Relaxed mode (no fuel hearts)</label>
    <label>Text size <select id="stSize"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select></label>
    <div class="stBtns"><button class="btn" id="stCred">Photo credits</button><button class="btn" id="stDev">Developer</button><button class="btn" id="stHelp">How to play</button><button class="btn" id="stSwitch">Switch traveller</button><button class="btn danger" id="stDel">Delete my data</button></div>
    <p class="small" id="cloudNote">${Cloud.db ? (Cloud.writable ? 'Shared leaderboard connected' : 'Leaderboard is read-only for you') : 'Saves are kept on this device'}</p>
    <button class="btn big go" id="stOk">Done</button></div>`);
  $('#stDev').onclick = () => showDev();
  $('#stSize').value = s.size; 
  const upd = () => { s.music = +$('#stMusic').value; s.sfx = +$('#stSfx').value; s.mute = $('#stMute').checked; s.cb = $('#stCb').checked; s.relaxed = $('#stRelax').checked; s.size = $('#stSize').value; applySettings(); save(); };
  ['stMusic', 'stSfx', 'stMute', 'stCb', 'stRelax', 'stSize'].forEach(id => $('#' + id).addEventListener('input', upd));
  $('#stSfx').addEventListener('change', () => Sound.sfx('green'));
  $('#stOk').onclick = () => { closeModal(); if (UI.screen === 'puzzle') { updateHUD(); $('#pzDots').innerHTML = (perStop() === 1 ? [] : [0, 1, 2]).map(k => `<span class="dot ${k < P.puz ? 'done' : k === P.puz ? 'cur' : ''}"></span>`).join(''); } if (UI.screen === 'map') renderMap({ keepView: true, noCard: true }); };
  $('#stHelp').onclick = () => showHelp();
  $('#stCred').onclick = showCredits;
  $('#stSwitch').onclick = () => { closeModal(); Store.remember = null; P = null; renderTitle(); };
  $('#stDel').onclick = () => {
    modal(`<div class="settings"><h2>Delete ${esc(P.name)}?</h2><p>This removes this traveller's passport, saves and leaderboard entry. It can't be undone.</p><div class="stBtns"><button class="btn" id="dNo">Keep</button><button class="btn danger" id="dYes">Delete</button></div></div>`);
    $('#dNo').onclick = showSettings;
    $('#dYes').onclick = async () => { const all = Store.local(); delete all[P.key]; Store.saveLocal(all); Store.remember = null; await cloudSave(); await pushLeaderboard(); if (Cloud.db && Cloud.writable) { try { const t = {}; Object.entries(all).forEach(([k, p]) => { if (p.uid === Cloud.uid) t[k] = lbRow(p); }); await Cloud.db.doc(`leaderboard/${Cloud.uid}`).set({ travellers: t }); await Cloud.db.doc(`data/users/${Cloud.uid}/save`).set({ travellers: Object.fromEntries(Object.entries(all).filter(([, p]) => p.uid === Cloud.uid)) }); } catch (e) { } } P = null; closeModal(); toast('Deleted'); renderTitle(); };
  };
}
function showCredits() {
  modal(`<div class="help"><h2>Photo credits</h2><p class="small">Photos are from Wikimedia Commons, cropped and resized, used under the licences shown.</p>${LOCS.map(L => { const p = PHOTOS[L.id]; return `<p class="small"><b>${esc(L.ch === 5 ? 'London (finale)' : L.name)}</b>: <a href="${p.url}" target="_blank" rel="noopener">${esc(p.by)}</a>, ${esc(p.lic)}</p>`; }).join('')}<button class="btn big go" id="hOk">Close</button></div>`);
  $('#hOk').onclick = closeModal;
}
function showHelp(first) {
  modal(`<div class="help"><h2>How to play</h2>
    <p>Guess the hidden word in <b>6 tries</b>. Every word is linked to the city you're visiting.</p>
    <div class="exRow">${[['T', 'green'], ['O', ''], ['W', 'yellow'], ['E', ''], ['R', 'grey']].map(([c, k]) => `<span class="tile mini flipped"><span class="face back ${k || 'plain'}">${c}</span></span>`).join('')}</div>
    <p><span class="sw green"></span> right letter, right spot · <span class="sw yellow"></span> in the word, wrong spot · <span class="sw grey"></span> not in the word</p>
    <p>Only real dictionary words are accepted. ${perStop() === 1 ? 'Solve <b>1 word</b> per stop' : ''} to earn a passport stamp and travel on. The word is picked at random each game. Boss stops use 6-letter words.</p>
    <p>A failed puzzle costs one fuel point. Run out and you refuel and retry that stop. A hint costs 15 coins.</p>
    <button class="btn big go" id="hOk">${first ? 'Start my voyage' : 'Got it'}</button></div>`);
  $('#hOk').onclick = closeModal;
}

// ================= wiring =================
function boot() {
  $('#colorRow').innerHTML = MASCOT_COLORS.map((c, i) => `<button class="colorPick ${i ? '' : 'sel'}" data-c="${c}" style="background:${c}" aria-label="Pip colour"></button>`).join('');
  $$('.colorPick').forEach(b => b.onclick = () => { $$('.colorPick').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); $('#titlePip').innerHTML = mascotSVG(b.dataset.c, 'wow'); Sound.init(); Sound.sfx('click'); });
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); submitName(); });
  $('#nameInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 16); });
  $('#toMapBtn').onclick = () => { Sound.sfx('click'); renderMap(); };
  $('#hintBtn').onclick = useHint;
  $$('.setBtn').forEach(b => b.onclick = () => { Sound.sfx('click'); showSettings(); });
  $$('.muteBtn').forEach(b => b.onclick = () => { Sound.init(); P.settings.mute = !P.settings.mute; applySettings(); save(); if (!P.settings.mute && UI.wantTune) Sound.play(UI.wantTune); });
  $$('.ppBtn').forEach(b => b.onclick = () => { Sound.sfx('click'); renderPassport(); });
  $$('.lbBtn').forEach(b => b.onclick = () => { Sound.sfx('click'); renderLeaderboard(); });
  $$('.backMap').forEach(b => b.onclick = () => { Sound.sfx('click'); renderMap(); });
  $('#lbBack').onclick = () => { Sound.sfx('click'); P ? renderMap() : renderTitle(); };
  $('#titleLb').onclick = () => { Sound.init(); renderLeaderboard(); };
  $$('#lbTabs button').forEach(b => b.onclick = () => renderLeaderboard(b.dataset.t));
  $('#zoomIn').onclick = () => zoomBy(0.75); $('#zoomOut').onclick = () => zoomBy(1.33);
  $('#zoomFit').onclick = () => tweenVB({ x: 0, y: 0, w: 1000, h: 520 }, 600);
  window.addEventListener('resize', () => { if (UI.screen === 'map') { measureMap(); setVB(clampVB(MAP.vb)); } });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#modal').classList.contains('stampModal') && !$('.result')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (UI.screen === 'puzzle' && !$('#modal').classList.contains('show')) { const k = e.key.toUpperCase(); if (k === 'ENTER' || k === 'BACKSPACE' || /^[A-Z]$/.test(k)) { e.preventDefault(); press(k); } }
  });
  // first gesture starts audio
  const unlock = () => { Sound.init(); if (P) applySettings(); if (UI.wantTune) Sound.play(UI.wantTune); window.removeEventListener('pointerdown', unlock, true); window.removeEventListener('keydown', unlock, true); };
  window.addEventListener('pointerdown', unlock, true); window.addEventListener('keydown', unlock, true);
  $('#whoopsImg').src = WHOOPS_IMG; $('#yahooImg').src = YAHOO_IMG;
  $$('[data-ic]').forEach(b => { b.innerHTML = ICON[b.dataset.ic]; });
  $$('.tourPick').forEach(b => b.onclick = () => { $$('.tourPick').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); });
  initMapGestures();
  const rem = Store.remember; const all = Store.local();
  if (rem && all[rem]) { $('#rememberMe').checked = true; login(all[rem]); } else renderTitle();
  initCloud();
}
document.addEventListener('DOMContentLoaded', boot);
</script></body></html>
